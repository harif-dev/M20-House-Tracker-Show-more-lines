<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>M20 House Tracker</title></head><body><header><h1>🏠 M20 House Tracker</h1><p>Construction Execution & Inspection Tracker</p></header><main><button id="installBtn" class="install" hidden>📲 Install M20 Tracker</button><section class="backup"><h2>💾 Backup & Restore</h2><p>Save your tracker records to a backup file, or restore them later on this or another device.</p><div class="backupactions"><button id="exportBtn" class="export">⬇ Export Backup</button><button id="restoreBtn" class="restore">⬆ Restore Backup</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><div id="backupMsg" class="msg" aria-live="polite"></div></section><section class="dash"><div><b id="pct">0%</b><span>Overall progress</span></div><div><b id="done">0 / 24</b><span>Stages complete</span></div></section><div class="bar"><i id="bar"></i></div><section class="tools"><input id="search" placeholder="Search stage, contractor, material..."><select id="filter"><option>All</option><option>Pending</option><option>In Progress</option><option>Completed</option></select></section><section id="stages"></section></main><dialog id="dlg"><form method="dialog"><button class="close">✕</button></form><div id="detail"></div></dialog><script src="./data.js"></script><script src="./app.js"></script></body></html>
